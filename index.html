<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fitness Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/be6af1d745.js"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>
    <script defer src="common.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header class="navbar">
      <div class="title">Fitness Tracker</div>
      <div class="nav-actions">
        <a
          class="icon-btn"
          id="cronologia-link"
          aria-label="Cronologia"
          href="cronologia.html"
        >
          <i class="fa-solid fa-clock-rotate-left"></i>
        </a>
        <button class="icon-btn" id="theme" aria-label="Passa al tema scuro">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <main class="container">
      <h1>Registra la giornata</h1>

      <section class="panel">
        <div class="msg" id="error" role="alert" hidden>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span></span>
        </div>
        <h2>Dati giornalieri</h2>
        <div class="grid">
          <label class="field">
            <span>Calorie</span>
            <input
              type="number"
              id="calorie"
              placeholder="kcal"
              min="100"
              max="20000"
              step="1"
            />
          </label>
          <label class="field">
            <span>Peso</span>
            <input
              type="number"
              id="peso"
              placeholder="kg"
              min="20"
              max="300"
              step="0.1"
            />
          </label>
          <label class="field">
            <span>Obiettivo</span>
            <input
              type="number"
              id="obiettivo"
              placeholder="kg"
              min="20"
              max="300"
              step="0.1"
            />
          </label>
          <label class="field">
            <span>Data</span>
            <input type="date" id="data" />
          </label>
        </div>
        <button class="btn btn-primary" id="btn-salva" type="button">
          Salva giorno
        </button>
      </section>

      <section class="status">
        <h2 id="stato">Stato</h2>
        <div class="status-value">
          <span id="diff">0</span><span class="unit">kg</span>
        </div>
        <p class="status-label">ancora da perdere</p>
      </section>

      <section class="panel">
        <div class="msg" id="error2" role="alert" hidden>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span></span>
        </div>
        <h2>Calcolo calorie</h2>
        <div class="grid">
          <label class="field">
            <span>Età</span>
            <input
              type="number"
              id="eta"
              placeholder="anni"
              min="10"
              max="120"
              step="1"
            />
          </label>
          <label class="field">
            <span>Altezza</span>
            <input
              type="number"
              id="altezza"
              placeholder="cm"
              min="100"
              max="250"
              step="1"
            />
          </label>
          <label class="field">
            <span>Sesso</span>
            <select id="sesso">
              <option value="uomo">Uomo</option>
              <option value="donna">Donna</option>
            </select>
          </label>
          <label class="field">
            <span>Livello di attività</span>
            <select id="attivita">
              <option value="1.2">Sedentario (nessun esercizio)</option>
              <option value="1.375">
                Leggero (sport 1-3 giorni/settimana)
              </option>
              <option value="1.55">
                Moderato (sport 3-5 giorni/settimana)
              </option>
              <option value="1.725">
                Intenso (sport 6-7 giorni/settimana)
              </option>
            </select>
          </label>
        </div>
        <button class="btn btn-secondary" id="btn-calcola" type="button">
          Calcola fabbisogno energetico
        </button>
        <div class="result">
          <span class="result-label">Calorie consigliate</span>
          <span class="result-value"><span id="calCons">0</span> kcal</span>
        </div>
        <div class="riepilogo" id="riepilogo" hidden>
          <div class="riepilogo-riga">
            <span>Media ultimi 7 giorni</span>
            <b id="media7">—</b>
          </div>
          <div class="riepilogo-riga">
            <span>Differenza giornaliera</span>
            <b id="deficit">—</b>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="row">
          <h2>Storico</h2>
          <a class="link-tutti" href="cronologia.html">
            <span>Vedi tutti</span>
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
        <div id="storico"></div>
        <canvas id="grafico" width="500" height="260"></canvas>
      </section>
    </main>
  </body>
</html>
